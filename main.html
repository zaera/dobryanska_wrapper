  // ==== ДАНІ/КОНФІГ ====
  const buildings = (window.BUILDINGS || []).slice();
  const APP = window.APP_CONFIG || {};
  const MAPCFG = APP.map || {};
  mapboxgl.accessToken = APP.accessToken || (window.config && window.config.accessToken) || '';

  // ==== КАРТА ====
  const map = new mapboxgl.Map({

  // Переключатель стилю
  class StyleToggleControl {

   toggle(){

}
  }

  // ==== THREEBOX ====
  window.tb = new Threebox(map, map.getCanvas().getContext('webgl'), { defaultLights: true });

  function syncTbViewport(){

  // світло
  tb.scene.children = tb.scene.children.filter(obj => !(obj.isLight));
  const ambient = new THREE.AmbientLight(0xffffff, 0.65); tb.scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff7e8, 1); sun.position.set(100,200,300);
  sun.castShadow = true; sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
  sun.shadow.radius = 8; sun.shadow.bias = -0.0005; tb.scene.add(sun);

  tb.renderer.shadowMap.enabled = true; tb.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // слой threebox (terrain вимкн)
  let tbLayerReady = false, inited = false;

        // ==== ТРАМВАЙ ====
let tramModel = null;
let tramPath = [];
let tramIndex = 0;
let tramProgress = 0;
let tramRotationOffset = 0;
let totalPathDistance = 0; // Общее расстояние всего маршрута
let tramSpeed = 0.015; // Базовая скорость (будет пересчитываться)
const tramTotalTime = 180; // Время для прохождения всего маршрута в секундах (3 минуты)

// Функция для вычисления расстояния между двумя точками в градусах
function haversineDistance(lon1, lat1, lon2, lat2) {
    const R = 6371000; // Радиус Земли в метрах
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c; // Расстояние в метрах
}

// Вычисляем общее расстояние пути
function calculateTotalPathDistance(path) {
    let total = 0;
    for (let i = 0; i < path.length - 1; i++) {
        const p1 = path[i];
        const p2 = path[i + 1];
        total += haversineDistance(p1[0], p1[1], p2[0], p2[1]);
    }
    return total;
}

// Угол поворота в точке (между входящим и выходящим сегментами), градусы 0..180
let tramTurnAnglesAtPoint = [];

function calculateTurnAnglesAtPoints(path) {
    if (!path || path.length < 3) return [];
    const angles = [];
    for (let j = 0; j < path.length; j++) {
        const prev = path[j - 1] ?? path[path.length - 1];
        const curr = path[j];
        const next = path[j + 1] ?? path[0];
        const bIn = bearingBetween(prev, curr);
        const bOut = bearingBetween(curr, next);
        let diff = Math.abs(((bOut - bIn + 540) % 360) - 180);
        angles[j] = diff;
    }
    return angles;
}

// Вычисляем скорость на основе расстояния
function calculateSpeedFromDistance(totalDistance, totalTime) {
    // totalDistance в метрах, totalTime в секундах
    // Возвращаем скорость в единицах прогресса в секунду
    return 1 / totalTime; // 1 - это весь путь (100%)
}

async function loadTramAndPath() {
    try {
        // 1. Завантажуємо шлях
        const res = await fetch('path.json?' + Date.now());
        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        const text = await res.text();
        let data;
        try {
            data = JSON.parse(text);
        } catch (parseError) {
            console.error('JSON parse error:', parseError);
            console.error('Response text:', text.substring(0, 200));
            throw new Error('Invalid JSON: ' + parseError.message);
        }
        if (!data || !Array.isArray(data.points) || data.points.length < 2) {
            throw new Error('Invalid path data');
        }
        tramPath = data.points;
        tramTurnAnglesAtPoint = calculateTurnAnglesAtPoints(tramPath);

        // 2. Вычисляем общее расстояние и скорость
        totalPathDistance = calculateTotalPathDistance(tramPath);
        tramSpeed = calculateSpeedFromDistance(totalPathDistance, tramTotalTime);
        
        console.log(`Общее расстояние маршрута: ${totalPathDistance.toFixed(2)} м`);
        console.log(`Время прохождения: ${tramTotalTime} сек`);
        console.log(`Рассчитанная скорость: ${tramSpeed.toFixed(6)} ед/сек`);

        // 3. Завантажуємо модель трамваю
        tb.loadObj(
            {
                type: 'gltf',
                obj: 'models/tram.glb',
                scale: 2.5,
                units: 'meters',
                anchor: 'center',
                rotation: {x: 90, y: 0, z: 0}
            },
            (obj) => {
                tramModel = obj;
                tramModel.setCoords(tramPath[0]);
                tb.add(tramModel);

                animateTram();
            },
            (err) => {
                console.error('Error loading tram model:', err);
            }
        );
    } catch (error) {
        console.error('Error loading tram path:', error);
    }
}

function bearingBetween(p1, p2) {
    const lng1 = THREE.MathUtils.degToRad(p1[0]);
    const lat1 = THREE.MathUtils.degToRad(p1[1]);
    const lng2 = THREE.MathUtils.degToRad(p2[0]);
    const lat2 = THREE.MathUtils.degToRad(p2[1]);

    const y = Math.sin(lng2 - lng1) * Math.cos(lat2);
    const x =
        Math.cos(lat1) * Math.sin(lat2) -
        Math.sin(lat1) * Math.cos(lat2) * Math.cos(lng2 - lng1);

    return THREE.MathUtils.radToDeg(Math.atan2(y, x));
}

// Точка на відстані d (м) від (lng, lat) у напрямку bearing (градуси). Повертає [lng, lat].
function pointAtDistance(lng, lat, d, bearingDeg) {
    const R = 6371000;
    const brng = bearingDeg * Math.PI / 180;
    const lat1 = lat * Math.PI / 180, lon1 = lng * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d / R) + Math.cos(lat1) * Math.sin(d / R) * Math.cos(brng));
    const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d / R) * Math.cos(lat1), Math.cos(d / R) - Math.sin(lat1) * Math.sin(lat2));
    return [lon2 * 180 / Math.PI, lat2 * 180 / Math.PI];
}

// Відстань від центру моделі до «носа» трамвая (м). На трасі — передня точка.
// Якщо ефект не працює, спробуй змінити це значення (наприклад, 4, 8, або 10)
const TRAM_FRONT_OFFSET_M = 6;

function animateTram() {
    if (!tramModel || tramPath.length < 2) return;

    let lastTime = performance.now();
    let targetQuaternion = new THREE.Quaternion();
    let currentQuaternion = new THREE.Quaternion();
    let rotationLerpSpeed = 4.2; // Базова швидкість повороту (трішки жвавіше)

    function step() {
        const currentTime = performance.now();
        const deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        const p1 = tramPath[tramIndex];
        let p2 = tramPath[tramIndex + 1];

        
        if (!p2) {
            tramIndex = 0;
            tramProgress = 0;
            p2 = tramPath[1];
        }

        const segmentDistance = haversineDistance(p1[0], p1[1], p2[0], p2[1]);
        
        if (segmentDistance < 0.1) {
            tramIndex = (tramIndex + 1) % (tramPath.length - 1);
            tramProgress = 0;
            requestAnimationFrame(step);
            return;
        }

        const segmentTimeRatio = segmentDistance / totalPathDistance;
        const segmentSpeed = 1 / (tramTotalTime * segmentTimeRatio);

        // Замедление на поворотах: сильнее в самом повороте; входить в поворот начинаем на 2/3 дороги до него
        const turnAtStart = tramTurnAnglesAtPoint[tramIndex] ?? 0;
        const turnAtEnd = tramTurnAnglesAtPoint[tramIndex + 1] ?? 0;
        const maxTurnOnSegment = Math.max(turnAtStart, turnAtEnd);
        let speedMultiplier = 1;
        const turnFactor = maxTurnOnSegment > 0 ? Math.min(1, maxTurnOnSegment / 90) : 0;
        if (maxTurnOnSegment > 0) {
            // В самом повороте — ещё сильнее замедляемся
            speedMultiplier = 1 - 0.88 * turnFactor;
            speedMultiplier = Math.max(0.12, speedMultiplier);
        }
        // На 2/3 дороги перед поворотом уже начинаем заходить (замедляемся)
        if (turnAtEnd > 0 && tramProgress >= 2/3) {
            const approachFactor = (tramProgress - 2/3) / (1/3);
            const approachSlowdown = 1 - 0.7 * Math.min(1, turnAtEnd / 90) * approachFactor;
            speedMultiplier = Math.min(speedMultiplier, Math.max(0.12, approachSlowdown));
        }

        tramProgress += segmentSpeed * deltaTime * speedMultiplier;

        if (tramProgress >= 1) {
            tramProgress = 0;
            tramIndex = (tramIndex + 1) % (tramPath.length - 1);
        }

        // Внутри step() функции, после вычисления tramProgress:
        if (tramProgress > 0.9) {
        const easeProgress = (tramProgress - 0.9) / 0.1;
        tramProgress = 0.9 + easeProgress * 0.1;
        }
        // Точка на трасі = передня частина вагона («ніс»)
        const currentLng = p1[0] + (p2[0] - p1[0]) * tramProgress;
        const currentLat = p1[1] + (p2[1] - p1[1]) * tramProgress;
        const currentAlt = (p1[2] !== undefined && p2[2] !== undefined) 
            ? p1[2] + (p2[2] - p1[2]) * tramProgress 
            : (p1[2] !== undefined ? p1[2] : 0);

        // Цільовий напрямок (куди дивиться «ніс»)
        let lookAheadPoint = p2;
        const lookAheadThreshold = 0.5;
        if (tramProgress > lookAheadThreshold && tramIndex < tramPath.length - 2) {
            lookAheadPoint = tramPath[tramIndex + 2];
        } else if (tramProgress > lookAheadThreshold && tramIndex === tramPath.length - 2) {
            lookAheadPoint = tramPath[0];
        }
        const bearing = bearingBetween([currentLng, currentLat], lookAheadPoint);
        const targetEuler = new THREE.Euler(
            THREE.MathUtils.degToRad(90),
            THREE.MathUtils.degToRad(-bearing + tramRotationOffset),
            0
        );
        targetQuaternion.setFromEuler(targetEuler);
        const angleRad = 2 * Math.acos(Math.min(1, Math.abs(currentQuaternion.dot(targetQuaternion))));
        const angleDeg = THREE.MathUtils.radToDeg(angleRad);
        const adaptiveSpeed = angleDeg > 70 ? 13 : (angleDeg > 45 ? 8.5 : rotationLerpSpeed);
        const lerpFactor = Math.min(1, adaptiveSpeed * deltaTime);
        currentQuaternion.slerp(targetQuaternion, lerpFactor);

        // Варіант 5: Обчислюємо позицію центру правильно, використовуючи поточний курс
        const currentEuler = new THREE.Euler().setFromQuaternion(currentQuaternion);
        const currentBearing = -THREE.MathUtils.radToDeg(currentEuler.y) + tramRotationOffset;
        
        // Обчислюємо позицію центру (назад від «носа» по поточному курсу)
        const [centerLng, centerLat] = pointAtDistance(currentLng, currentLat, TRAM_FRONT_OFFSET_M, currentBearing + 180);
        
        // Ставимо центр моделі
        tramModel.setCoords([centerLng, centerLat, currentAlt]);
        tramModel.setRotationFromQuaternion(currentQuaternion);
        
        // Додатково: якщо потрібно, застосовуємо локальне зміщення через Three.js
        // (на випадок, якщо pointAtDistance не працює правильно)
        if (tramModel.model && tramModel.model.position) {
            // Встановлюємо локальну позицію (в локальних координатах моделі)
            // Після повороту на 90° по X, вісь Z вказує вперед/назад
            tramModel.model.position.set(0, 0, -TRAM_FRONT_OFFSET_M);
        }

        tb.update();
        requestAnimationFrame(step);
    }

    // Инициализация начального поворота
    if (tramPath.length > 1) {
        const initialBearing = bearingBetween(tramPath[0], tramPath[1]);
        const initialEuler = new THREE.Euler(
            THREE.MathUtils.degToRad(90),
            THREE.MathUtils.degToRad(-initialBearing + tramRotationOffset),
            0
        );
        currentQuaternion.setFromEuler(initialEuler);
        targetQuaternion.copy(currentQuaternion);
    }

    step();
}


  // ==== маркери/моделі + LOADER ====
  let activeMarkerId = null;

function checkLoaded(){
  if (loadedCount >= totalToLoad) {
    loader.classList.add('fade-out');

    loader.addEventListener('transitionend', () => {
      loader.classList.remove('show');
      loader.classList.remove('fade-out');
      loader.style.display = 'none';
    }, { once: true });
  }
}


function upsertMarker(b) {
  if (markers.has(b.id)) return markers.get(b.id);

  const wrap = document.createElement('div');
  wrap.className = 'mk-wrap';

  const img = document.createElement('img');
  img.className = 'mk-img';
  img.src = 'media/marker.png';
  img.alt = b.name;

  wrap.appendChild(img);

  const marker = new mapboxgl.Marker({
    element: wrap,
    anchor: 'bottom',
    offset: [0, -20]
  })
    .setLngLat([b.lng, b.lat])
    .addTo(map);

wrap.addEventListener('click', (e) => {
  e.stopPropagation();
  setNarration(b);
  openOverlay(b);
  focusBuilding(b, 'marker');
});

  markers.set(b.id, marker);
  return marker;
}
    function ensureModel(b) {
    if(!b.modelUrl || models.has(b.id) || !tbLayerReady) return;
    tb.loadObj(
      { type:'gltf', obj:b.modelUrl, scale:b.scale||8, units:'meters',
        rotation:{x:b.rotX||0,y:b.rotY||0,z:b.rotZ||0}, anchor:'center' },
      (obj)=>{
        obj.setCoords([b.lng,b.lat,b.alt||8]);
        obj.userData.buildingId = b.id;
        obj.addTooltip(b.name, true);
        tb.add(obj);
        models.set(b.id,obj);
        loadedCount++; 
        checkLoaded();
      },
      (err)=>{
        console.error(err);
        loadedCount++; 
        checkLoaded();
      }
    );
  }

  // ==== плавний політ (TWEEN) ====
  (function rafLoop(time){ TWEEN.update(time); requestAnimationFrame(rafLoop); })();
  function shortestBearing(from, to){ let diff = ((to - from + 540) % 360) - 180; return from + diff; }
  let currentTween = null;
  function tweenToBuilding(b, opts={}){
    const start = { lng: map.getCenter().lng, lat: map.getCenter().lat, zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() };
    const target = { lng: b.lng, lat: b.lat, zoom: opts.zoom ?? 16.5, pitch: opts.pitch ?? 60, bearing: shortestBearing(start.bearing, opts.bearing ?? map.getBearing()) };
    if (currentTween) currentTween.stop();
    currentTween = new TWEEN.Tween(start)
      .to(target, opts.duration ?? 1600)
      .easing(opts.easing ?? TWEEN.Easing.Quadratic.InOut)
      .onUpdate(v=> map.jumpTo({ center:[v.lng, v.lat], zoom:v.zoom, pitch:v.pitch, bearing:v.bearing }))
      .start();
  }

//підсвічування елемента списку червоним при фокусі на будівлі
function setActiveListItem(buildingId) {
  document.querySelectorAll('#list .item').forEach(el => {
    el.classList.toggle('active', el.dataset.id == buildingId);
  });
}


function focusBuilding(b, source = 'unknown') {
    if (activeMarkerId && activeMarkerId !== b.id) {
    const prev = markers.get(activeMarkerId);
    resetMarkerVisual(prev);
    }

  const marker = upsertMarker(b);
  ensureModel(b);
  tweenToBuilding(b, { duration: 1600 });

  const wrap = marker.getElement();
  const img  = wrap.querySelector('.mk-img');
  if (!wrap || !img) return;

  const allowRestore = source === 'marker' || source === 'list';

 if (allowRestore && activeMarkerId && activeMarkerId !== b.id) {
  const prev = markers.get(activeMarkerId);
    if (prev && prev._removed) {
    resetMarkerVisual(prev);
    prev.addTo(map);
    prev._removed = false;
    }
}


  wrap.style.opacity = '1';
  wrap.style.pointerEvents = 'auto';

    if (activeMarkerId && activeMarkerId !== b.id) {
        const prev = markers.get(activeMarkerId);
        if (prev) {
            prev.getElement().classList.remove('active');
        }
    }
    if (activeMarkerId && activeMarkerId !== b.id) {
        const prev = markers.get(activeMarkerId);
        if (prev) {
            prev.getElement().classList.remove('active');
        }
    }
    wrap.classList.add('active');
    wrap.classList.remove('focus-blink');
    void img.offsetWidth;
    wrap.classList.add('focus-blink');


  activeMarkerId = b.id;
  setActiveListItem(b.id);
}

function resetMarkerVisual(marker) {
  if (!marker) return;

  const wrap = marker.getElement();
  if (!wrap) return;

  wrap.classList.remove('focus-blink');

  // Якщо була анімація - скидуємо
  const img = wrap.querySelector('.mk-img');
  if (img) void img.offsetWidth;

  clearTimeout(marker._hideTimer);
}
 // Змінні для зберігання поточних налаштувань
  let bgCoords = MAPCFG.center;

    function renderList(filter = '') {
    listEl.innerHTML='';
    const q = filter.trim().toLowerCase();
    buildings
      .filter(b => !q || b.name.toLowerCase().includes(q) || (b.note||'').toLowerCase().includes(q))
      .forEach(b=>{
        const row = document.createElement('div');

          <div style="display:flex;flex-direction:column;min-width:0">

});

  renderList();

  // ==== Галерея/модал ====
  let galleryKeyHandler = null;

        function buildGallery(media) {
            const wrap = document.createElement('div');
            wrap.className = 'gallery';

            const viewport = document.createElement('div');
            viewport.className = 'g-viewport';

            const caption = document.createElement('div');
            caption.className = 'g-caption';

            const dotsWrap = document.createElement('div');
            dotsWrap.className = 'g-dots';

            const btnPrev = document.createElement('button');
            btnPrev.className = 'g-prev';
            btnPrev.innerHTML = '<span class="material-symbols-outlined">chevron_left</span>';

            const btnNext = document.createElement('button');
            btnNext.className = 'g-next';
            btnNext.innerHTML = '<span class="material-symbols-outlined">chevron_right</span>';

            let ix = 0;
            let dots = [];

            function nodeFor(item) {
                if (item.type === 'youtube') {
                    const ifr = document.createElement('iframe');
                    ifr.allow =
                        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    ifr.allowFullscreen = true;
                    ifr.referrerPolicy = 'strict-origin-when-cross-origin';
                    ifr.src = `https://www.youtube.com/embed/${item.videoId}?rel=0&modestbranding=1`;
                    return ifr;
                } else {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.caption || '';
                    return img;
                }
            }

            function show(n) {
                ix = (n + media.length) % media.length;

                const node = nodeFor(media[ix]);
                viewport.innerHTML = '';
                viewport.appendChild(node);

                // принудительный reflow
                void node.offsetWidth;

                node.classList.add('active');

                caption.textContent = media[ix].caption || '';
                dots.forEach((d, i) => d.classList.toggle('active', i === ix));
            }

            dots = media.map((_, i) => {
                const d = document.createElement('button');
                d.className = 'g-dot';
                d.addEventListener('click', () => show(i));
                dotsWrap.appendChild(d);
                return d;
            });

            btnPrev.addEventListener('click', () => show(ix - 1));
            btnNext.addEventListener('click', () => show(ix + 1));
            wrap.appendChild(viewport);
            wrap.appendChild(btnPrev);
            wrap.appendChild(btnNext);
            wrap.appendChild(caption);
            wrap.appendChild(dotsWrap);

            show(0);

            return { el: wrap };
        }
})();
