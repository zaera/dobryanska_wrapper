<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8" />
    <title>Історичні будівлі Дніпра — мапа з Threebox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Mapbox GL JS (локальнi файли) -->
    <link href="css/mapbox-gl.css" rel="stylesheet">
    <script src="js/mapbox-gl.js"></script>

    <!-- Threebox (локальнi файли) -->
    <script src="js/threebox.js" type="text/javascript"></script>
    <link href="css/threebox.css" rel="stylesheet" />

    <!-- Токен -->
    <script src="config.js"></script>

    <!-- Wavesurfer -->
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

    <!-- TWEEN.js -->
    <script src="js/tween.umd.js"></script>

    <!-- Даннi будівель -->
    <script src="buildings.js"></script>

    <!-- Шрифти / іконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
<div id="app">
  <!-- LOADER -->
  <div id="loader" class="loader"></div>

  <!-- OVERLAY (попап) -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <button id="ovClose" class="close" title="Закрити"><span class="material-symbols-outlined">close</span></button>
      <h2 id="ovTitle">Будівля</h2>
      <div id="ovSub" class="muted"></div>
      <div id="ovBody" class="body"></div>
    </div>
  </div>

  <header>
      <div class="header-left">
          <div id="logo">
              <img src="logo.png" alt="Logotype">
          </div>
          <div class="divider"></div>
          <div class="header-text">
              Пам'ятки архітектури<br>національного значення в Дніпрі
          </div>
      </div>

      <a href="/admin.html" class="user-btn" title="Адмінка">
          <span class="material-symbols-outlined">person</span>
      </a>
  </header>

  <div class="main">
    <aside id="sidebar">
      <button class="toggle" id="btnToggle" title="Згорнути/Розгорнути">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <div class="sb-head"><div class="sb-title" style="font-weight: 700; color: var(--ink);">Список історичних будівель</div></div>
      <div class="search">
          <span class="material-symbols-outlined" style="font-size:20px; color:#353A3E; ">search</span>
          <input id="search" type="text" style="color: #353A3E;" placeholder="Пошук будівлі…" />

      </div>
      <div class="list" id="list"></div>
    </aside>

    <section class="map-card">
      <div id="map"></div>

      <!-- Аудіо-віджет -->
      <div id="narration" class="narration" aria-live="polite">
        <div class="nar-player">
          <button id="narPlay" class="nar-btn" title="Відтворити/Пауза">
            <span id="narIcon" class="material-symbols-outlined">play_arrow</span>
          </button>
          <div class="nar-wave-wrap"><div id="narWave"></div></div>
        </div>
        <div class="nar-bottom">
          <button id="narTranscriptBtn" class="nar-trans-btn">Показати транскрипцію</button>
        </div>
        <div id="narTranscript" class="nar-transcript"></div>
      </div>
    </section>
  </div>

  <footer><div class="foot">ДНЛІТ 2025</div></footer>
</div>

<script>
    
    (function () {
        console.log("main script");
  const $ = (s, root=document)=>root.querySelector(s);
  const listEl = $('#list'); const searchEl = $('#search');
  const overlay = $('#overlay'); const ovTitle = $('#ovTitle');
  const ovSub = $('#ovSub'); const ovBody = $('#ovBody');
  const ovClose = $('#ovClose'); const sidebar = $('#sidebar');
  const main = document.querySelector('.main'); const btnToggle = $('#btnToggle');
  const loader = $('#loader');
        // Згортання сайдбару
        btnToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            document.body.classList.toggle('sb-collapsed');

            const icon = btnToggle.querySelector('.material-symbols-outlined');
            if (sidebar.classList.contains('collapsed')) {
                icon.textContent = 'chevron_right';
                icon.title = 'Розгорнути';

                const content = sidebar.querySelectorAll(':not(.toggle)');
                content.forEach(el => {
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                });

            } else {
                icon.textContent = 'chevron_left';
                icon.title = 'Згорнути';

                const content = sidebar.querySelectorAll(':not(.toggle)');
                content.forEach(el => {
                    el.style.opacity = '1';
                    el.style.pointerEvents = 'auto';
                });
            }

            setTimeout(() => {
                map.resize();
                syncTbViewport();
            }, 300);
        });
    // Сторінка завантаження
    const headerLogo = document.querySelector('#logo img');

    if (loader && headerLogo) {
    const wrap = document.createElement('div');
    wrap.className = 'loader-content';

    const logo = headerLogo.cloneNode(true);
    logo.classList.add('loader-logo');

    const text = document.createElement('div');
    text.className = 'loader-text';
    text.textContent = 'ЗАВАНТАЖЕННЯ';

    wrap.appendChild(logo);
    wrap.appendChild(text);
    loader.appendChild(wrap);
    }



    // ==== POPUP (overlay) ====

  function openOverlay(b){
    ovTitle.textContent = b.name;
    ovSub.textContent = b.note || '';
    ovBody.innerHTML = '';
    if (Array.isArray(b.media) && b.media.length && typeof buildGallery === 'function'){
      const { el } = buildGallery(b.media);
      ovBody.appendChild(el);
    }

    const info = document.createElement('div');
    info.innerHTML = b.infoHtml || '';
    info.style.marginTop = '10px';
    ovBody.appendChild(info);

    overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      if (typeof b.lat === 'number' && typeof b.lng === 'number') {
          const coords = document.createElement('div');

          coords.style.marginTop = '12px';
          coords.style.fontSize = '13px';
          coords.style.color = 'var(--muted)';

          /* ВАЖНО: тот же уровень, что у media / caption */
          coords.style.padding = '0 2px';

          const lat = b.lat.toFixed(6);
          const lng = b.lng.toFixed(6);

          const gmapsUrl =
              `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

          coords.innerHTML = `
        <strong>Координати:</strong>
        <a href="${gmapsUrl}"
           target="_blank"
           rel="noopener noreferrer"
           style="color: var(--accent); text-decoration: underline;">
           ${lat}; ${lng}
        </a>
    `;

          ovBody.appendChild(coords);
      }


    galleryKeyHandler = (e)=>{ if (e.key === 'Escape') closeOverlay(); };
    window.addEventListener('keydown', galleryKeyHandler);
  }

  function closeOverlay(){
    overlay.classList.remove('show');
    document.body.style.overflow = '';

    if (galleryKeyHandler){
      window.removeEventListener('keydown', galleryKeyHandler);
      galleryKeyHandler = null;
    }
    ovBody.querySelectorAll('iframe').forEach(ifr => { 
      try { ifr.src = ifr.src; } catch(e){} 
    });
  }

  if (ovClose) ovClose.addEventListener('click', closeOverlay);
  if (overlay) overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay(); });


  // ==== Аудио (WaveSurfer) ====
  const nar = $('#narration');
  const narPlay = $('#narPlay');
  const narIcon = $('#narIcon');
  const narWave = $('#narWave');
  const narTranscript = $('#narTranscript');
  const narTranscriptBtn = $('#narTranscriptBtn');

  const ws = WaveSurfer.create({
    container: narWave,
    waveColor: '#c7d2fe',
    progressColor: '#5e76fa',
    cursorColor: '#8a90a8',
    cursorWidth: 2,
    height: 40,
    barWidth: 4,
    barGap: 1.2,
    barRadius: 3,
    responsive: true,
    normalize: true,
  });

  ws.on('ready', ()=>{ narIcon.textContent = 'play_arrow'; });
  ws.on('play',  ()=>{ narIcon.textContent = 'pause'; });
  ws.on('pause', ()=>{ narIcon.textContent = 'play_arrow'; });
  ws.on('finish',()=>{ narIcon.textContent = 'play_arrow'; });

  narPlay.addEventListener('click', ()=>{
    if (!ws.getDecodedData()) return;
    ws.isPlaying() ? ws.pause() : ws.play();
  });

  narTranscriptBtn.addEventListener('click', ()=>{
    const open = narTranscript.classList.toggle('show');
    narTranscriptBtn.textContent = open ? 'Сховати транскрипцію' : 'Показати транскрипцію';
  });

  let currentAudioId = null;

  function setNarration(b){
    if (!b || !b.audio || !b.audio.src){
      nar.classList.remove('show');
      ws.empty(); 
      currentAudioId = null;
      return;
    }
    nar.classList.add('show');
    if (currentAudioId === b.id && ws.getDecodedData()) {
      narTranscript.textContent = b.audio.transcript || '';
      return;
    }

    currentAudioId = b.id;
    narTranscript.textContent = b.audio.transcript || '';
    narTranscript.classList.remove('show');
    narTranscriptBtn.textContent = 'Показати транскрипцію';

    try { ws.load(b.audio.src); } catch(e){ console.error(e); }
  }

  // ==== ДАНІ/КОНФІГ ====
  const buildings = (window.BUILDINGS || []).slice();
  const APP = window.APP_CONFIG || {};
  const MAPCFG = APP.map || {};
  mapboxgl.accessToken = APP.accessToken || (window.config && window.config.accessToken) || '';

  // ==== КАРТА ====
  const map = new mapboxgl.Map({
    container: 'map',
    style: MAPCFG.styleA || 'mapbox://styles/mapbox/satellite-streets-v12',
    center: MAPCFG.center || [35.0460, 48.4647],
    zoom: MAPCFG.zoom ?? 14.5,
    pitch: MAPCFG.pitch ?? 50,
    bearing: MAPCFG.bearing ?? 10,
    antialias: true,
    attributionControl: false
  });
    //map.setMinPitch(45);
    map.setMaxPitch(70);
    map.addControl(new mapboxgl.NavigationControl({ visualizePitch:true }), 'top-right');

  // Переключатель стилю
  class StyleToggleControl {
    onAdd(map){
      this._map = map;
      this._el = document.createElement('div');
      this._el.className = 'mapboxgl-ctrl style-toggle';

      const btn = document.createElement('button');
      const icon = document.createElement('span');
      icon.className = 'material-symbols-outlined';
      icon.textContent = 'satellite_alt';
      btn.appendChild(icon);
      btn.title = 'Переключити стиль: супутник/карта';
      btn.addEventListener('click', ()=> this.toggle());

      this._btn = btn; this._icon = icon;
      this._el.appendChild(btn);
      this._current = 'A';
      return this._el;
    }
    onRemove(){ this._el.remove(); this._map = undefined; }
    toggle(){
      const nextKey = this._current === 'A' ? 'B' : 'A';
      const nextStyle = nextKey === 'A' ? MAPCFG.styleA : MAPCFG.styleB;
      this._current = nextKey;
      this._icon.textContent = (nextKey === 'A') ? 'satellite_alt' : 'map';
      if (nextStyle) this._map.setStyle(nextStyle);
    }
  }
  map.addControl(new StyleToggleControl(), 'top-left');

  // Перемикач фонової моделі
  class BgToggleControl {
    onAdd(map){
      this._map = map;
      this._el = document.createElement('div');
      this._el.className = 'mapboxgl-ctrl bg-toggle';

      const btn = document.createElement('button');
      const icon = document.createElement('span');
      icon.className = 'material-symbols-outlined';
      icon.textContent = 'location_city';
      btn.appendChild(icon);
      btn.title = 'Показати/приховати фонові будівлі';
      btn.addEventListener('click', ()=> this.toggle());

      this._btn = btn; this._icon = icon;
      this._el.appendChild(btn);
      this._visible = true;
      return this._el;
    }
    onRemove(){ this._el.remove(); this._map = undefined; }
   toggle(){
  this._visible = !this._visible;

  if (window.bgModel) {
    window.bgModel.visible = this._visible;
    window.tb.update();
    this._map.triggerRepaint();
  }
  this._el.classList.toggle('off', !this._visible);
}
  }
  map.addControl(new BgToggleControl(), 'top-left');

  // ==== THREEBOX ====
  window.tb = new Threebox(map, map.getCanvas().getContext('webgl'), { defaultLights: true });

  function syncTbViewport(){
    if (!tb || !tb.renderer || !tb.camera) return;
    const canvas = map.getCanvas();
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    tb.renderer.setPixelRatio(dpr);
    tb.renderer.setSize(w, h, false);
    tb.camera.aspect = (h === 0) ? 1 : (w/h);
    tb.camera.updateProjectionMatrix();
    tb.update && tb.update();
  }
  map.on('resize', syncTbViewport);

  // світло
  tb.scene.children = tb.scene.children.filter(obj => !(obj.isLight));
  const ambient = new THREE.AmbientLight(0xffffff, 0.65); tb.scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff7e8, 1); sun.position.set(100,200,300);
  sun.castShadow = true; sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
  sun.shadow.radius = 8; sun.shadow.bias = -0.0005; tb.scene.add(sun);
  const hemi = new THREE.HemisphereLight(0xe0eaff, 0x888888, 0); tb.scene.add(hemi);
  tb.renderer.shadowMap.enabled = true; tb.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // слой threebox (terrain вимкн)
  let tbLayerReady = false, inited = false;
  map.on('style.load', ()=>{
    if (!map.getLayer('tb-layer')) {
      map.addLayer({ id:'tb-layer', type:'custom', renderingMode:'3d', onAdd:()=>{}, render:()=>{ tb && tb.update(); }});
    }
    map.setFog({
      color: 'rgb(113,113,113)',
      'horizon-blend': 1
    });
    tbLayerReady = true;
    syncTbViewport();
    initOnce();
  });

  // ==== маркери/моделі + LOADER ====
  let activeMarkerId = null;
  const markers = new Map();
  const models  = new Map();
  const totalToLoad = buildings.length;
  let loadedCount = 0;
  if (totalToLoad > 0) loader.classList.add('show');

  function checkLoaded(){
    if (loadedCount >= totalToLoad) loader.classList.remove('show');
  }

function upsertMarker(b) {
  if (markers.has(b.id)) return markers.get(b.id);

  const wrap = document.createElement('div');
  wrap.className = 'mk-wrap';

  const img = document.createElement('img');
  img.className = 'mk-img';
  img.src = 'media/marker.png';
  img.alt = b.name;

  wrap.appendChild(img);

  const marker = new mapboxgl.Marker({
    element: wrap,
    anchor: 'bottom',
    offset: [0, -20]
  })
    .setLngLat([b.lng, b.lat])
    .addTo(map);

wrap.addEventListener('click', (e) => {
  e.stopPropagation();
  setNarration(b);
  openOverlay(b);
  focusBuilding(b, 'marker');
});

  markers.set(b.id, marker);
  return marker;
}
    function ensureModel(b) {
        console.log('ensureModel');
    if(!b.modelUrl || models.has(b.id) || !tbLayerReady) return;
    tb.loadObj(
      { type:'gltf', obj:b.modelUrl, scale:b.scale||8, units:'meters',
        rotation:{x:b.rotX||0,y:b.rotY||0,z:b.rotZ||0}, anchor:'center' },
      (obj)=>{
        obj.setCoords([b.lng,b.lat,b.alt||8]);
        obj.userData.buildingId = b.id;
        obj.addTooltip(b.name, true);
        tb.add(obj);
        models.set(b.id,obj);
        loadedCount++; 
        checkLoaded();
      },
      (err)=>{
        console.error(err);
        loadedCount++; 
        checkLoaded();
      }
    );
  }

  // ==== плавний політ (TWEEN) ====
  (function rafLoop(time){ TWEEN.update(time); requestAnimationFrame(rafLoop); })();
  function shortestBearing(from, to){ let diff = ((to - from + 540) % 360) - 180; return from + diff; }
  let currentTween = null;
  function tweenToBuilding(b, opts={}){
    const start = { lng: map.getCenter().lng, lat: map.getCenter().lat, zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() };
    const target = { lng: b.lng, lat: b.lat, zoom: opts.zoom ?? 16.5, pitch: opts.pitch ?? 60, bearing: shortestBearing(start.bearing, opts.bearing ?? map.getBearing()) };
    if (currentTween) currentTween.stop();
    currentTween = new TWEEN.Tween(start)
      .to(target, opts.duration ?? 1600)
      .easing(opts.easing ?? TWEEN.Easing.Quadratic.InOut)
      .onUpdate(v=> map.jumpTo({ center:[v.lng, v.lat], zoom:v.zoom, pitch:v.pitch, bearing:v.bearing }))
      .start();
  }

function focusBuilding(b, source = 'unknown') {
    if (activeMarkerId && activeMarkerId !== b.id) {
    const prev = markers.get(activeMarkerId);
    resetMarkerVisual(prev);
    }

  const marker = upsertMarker(b);
  ensureModel(b);
  tweenToBuilding(b, { duration: 1600 });

  const wrap = marker.getElement();
  const img  = wrap.querySelector('.mk-img');
  if (!wrap || !img) return;

  const allowRestore = source === 'marker' || source === 'list';

 if (allowRestore && activeMarkerId && activeMarkerId !== b.id) {
  const prev = markers.get(activeMarkerId);
    if (prev && prev._removed) {
    resetMarkerVisual(prev);
    prev.addTo(map);
    prev._removed = false;
    }
}

  wrap.style.opacity = '1';
  wrap.style.pointerEvents = 'auto';

  if (activeMarkerId && activeMarkerId !== b.id) {
    const prev = markers.get(activeMarkerId);
    if (prev) {
        prev.getElement().classList.remove('active');
    }
    }
    if (activeMarkerId && activeMarkerId !== b.id) {
    const prev = markers.get(activeMarkerId);
    if (prev) {
        prev.getElement().classList.remove('active');
    }
    }
    wrap.classList.add('active');

    wrap.classList.remove('focus-blink');
    void img.offsetWidth;
    wrap.classList.add('focus-blink');

    activeMarkerId = b.id;
}

function resetMarkerVisual(marker) {
  if (!marker) return;

  const wrap = marker.getElement();
  if (!wrap) return;

  wrap.classList.remove('focus-blink');

  // Якщо була анімація - скидуємо
  const img = wrap.querySelector('.mk-img');
  if (img) void img.offsetWidth;

  clearTimeout(marker._hideTimer);
}





  
  // Змінні для зберігання поточних налаштувань
  let bgCoords = MAPCFG.center;
  let bgAlt = -1;
  let bgScale = 1;
  let bgRotation = { x: 90, y: 180, z: 0 };
  
  // первинна ініціалізація
  function initOnce(){
    if (inited || !tbLayerReady) return;
    
    // ==== ЗАВАНТАЖЕННЯ МОДЕЛЕЙ та ФОНОВИХ БУДІВЕЛЬ ====
    var tempObj= {
      "lng": 34.989968,
      "lat": 48.453224,
      "alt": -1,
      "modelUrl": "models/Town-Gradient.glb",
      "scale": 1,
      "rotX": 90,
      "rotY": 180,
      "rotZ": 0
    };

    tb.loadObj(
      { type:'gltf', obj:tempObj.modelUrl, scale:tempObj.scale||8, units:'meters',
        rotation:{x:tempObj.rotX||0,y:tempObj.rotY||0,z:tempObj.rotZ||0}, anchor:'center' },
      (obj)=>{
        obj.setCoords([tempObj.lng,tempObj.lat,tempObj.alt||8]);
        tb.add(obj);
        // Зберігаємо посилання на фонову модель для управління видимістю
        window.bgModel = obj;
        loadedCount++;    
        
        buildings.forEach(upsertMarker);
        buildings.forEach(ensureModel);    
        inited = true;
        syncTbViewport();
        checkLoaded();
      },
      (err)=>{
        console.error(err);
        loadedCount++;
      }
    );
  }

  // ==== список у сайдбарі ====
    function renderList(filter = '') {
        console.log("renderList");
    listEl.innerHTML='';
    const q = filter.trim().toLowerCase();
    buildings
      .filter(b => !q || b.name.toLowerCase().includes(q) || (b.note||'').toLowerCase().includes(q))
      .forEach(b=>{
        const row = document.createElement('div');
        row.className='item';
        row.innerHTML = `<div class="dot"></div>
          <div style="display:flex;flex-direction:column;min-width:0">
            <div class="name">${b.name}</div>
            <div class="desc">${b.note||''}</div>
          </div>`;
        row.addEventListener('click', () => {
  focusBuilding(b, 'list');
  setNarration(b);
});
        listEl.appendChild(row);
      });
  }
  renderList();
  searchEl.addEventListener('input', e=>renderList(e.target.value));

  // ==== Галерея/модал ====
  let galleryKeyHandler = null;

        function buildGallery(media) {
            const wrap = document.createElement('div');
            wrap.className = 'gallery';

            const viewport = document.createElement('div');
            viewport.className = 'g-viewport';

            const caption = document.createElement('div');
            caption.className = 'g-caption';

            const dotsWrap = document.createElement('div');
            dotsWrap.className = 'g-dots';

            const btnPrev = document.createElement('button');
            btnPrev.className = 'g-prev';
            btnPrev.innerHTML = '<span class="material-symbols-outlined">chevron_left</span>';

            const btnNext = document.createElement('button');
            btnNext.className = 'g-next';
            btnNext.innerHTML = '<span class="material-symbols-outlined">chevron_right</span>';

            let ix = 0;
            let dots = [];

            function nodeFor(item) {
                if (item.type === 'youtube') {
                    const ifr = document.createElement('iframe');
                    ifr.allow =
                        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    ifr.allowFullscreen = true;
                    ifr.referrerPolicy = 'strict-origin-when-cross-origin';
                    ifr.src = `https://www.youtube.com/embed/${item.videoId}?rel=0&modestbranding=1`;
                    return ifr;
                } else {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.alt = item.caption || '';
                    return img;
                }
            }

            function show(n) {
                ix = (n + media.length) % media.length;

                viewport.innerHTML = '';
                viewport.appendChild(nodeFor(media[ix]));

                caption.textContent = media[ix].caption || '';

                dots.forEach((d, i) => d.classList.toggle('active', i === ix));
            }

            dots = media.map((_, i) => {
                const d = document.createElement('button');
                d.className = 'g-dot';
                d.addEventListener('click', () => show(i));
                dotsWrap.appendChild(d);
                return d;
            });

            btnPrev.addEventListener('click', () => show(ix - 1));
            btnNext.addEventListener('click', () => show(ix + 1));
            wrap.appendChild(viewport);
            wrap.appendChild(btnPrev);
            wrap.appendChild(btnNext);
            wrap.appendChild(caption);
            wrap.appendChild(dotsWrap);

            show(0);

            return { el: wrap };
        }
})();
</script>
</body>
</html>
