<!DOCTYPE html>
<html lang="uk">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8" />
    <title>Історичні будівлі Дніпра — мапа з Threebox</title>
    <!-- Шрифти / іконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        :root {
            --bg: #1A1A1A;
            --paper: #222526;
            --ink: #d7d7d7;
            --muted: #90918c;
            --line: #E0E0E0;
            --accent: #E0E0E0;
            --shadow: 0 10px 30px rgba(0,0,0,.06), 0 2px 10px rgba(0,0,0,.04);
            --radius: 10px;
        }

        @font-face {
            font-family: "e-Ukraine";
            src: url("../fonts/e-UkraineHead-Regular.otf") format("e-Ukraine-Regular"), url("../fonts/e-UkraineHead-LOGO.otf") format("e-Ukraine-Logo");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "e-Ukraine-Bold";
            src: url("../fonts/e-UkraineHead-Bold.otf") format("e-Ukraine-Bold");
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "e-Ukraine", "Inter", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== ОСНОВНІ СТИЛІ ДЛЯ ЕФЕКТУ ВИРІЗАННЯ ===== */
        .container {
            position: relative;
            width: 60%;
            height: 100vh;
            overflow: hidden;
        }

        .background {
            position: absolute;
            inset: 0;
            background: url("https://picsum.photos/1600/900") center/cover no-repeat;
            z-index: 0;
        }

        .text-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 2;
            padding-left: 10%;
        }

        .text {
            font-size: calc(18vw + 10px);
            font-weight: 900;
            font-family: "e-Ukraine-Bold", "e-Ukraine", "Inter", sans-serif;
            color: transparent;
            background: url("https://picsum.photos/1600/900") center/cover no-repeat;
            background-clip: text;
            -webkit-background-clip: text;
            background-attachment: fixed;
            letter-spacing: 0.05em;
            pointer-events: none;
            /* Обводка */
            -webkit-text-stroke: 3px #ffffff;
            text-stroke: 3px #ffffff;
            line-height: 0.8;
        }

        .mask {
            position: absolute;
            inset: 0;
            background: var(--bg);
            clip-path: inset(0 50% 0 0);
            transition: clip-path 0.1s ease-out;
            z-index: 1;
        }

        /* ===== ПРАВА ПАНЕЛЬ ===== */
        .right-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 40%;
            height: 100vh;
            background: rgba(34, 37, 38, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }

        .panel-header {
            margin-bottom: 50px;
            text-align: center;
        }

            .panel-header h2 {
                font-size: 1.8rem;
                color: var(--ink);
                font-weight: 600;
                margin-bottom: 15px;
                line-height: 1.3;
            }

            .panel-header p {
                color: var(--muted);
                font-size: 1rem;
                line-height: 1.5;
            }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            justify-content: center;
        }

        .panel-btn {
            width: 100%;
            padding: 20px 24px;
            background: var(--paper);
            color: var(--ink);
            border: 2px solid var(--line);
            border-radius: var(--radius);
            font-family: "e-Ukraine", "Inter", sans-serif;
            font-size: calc(1.2rem + 0.3vw);
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

            .panel-btn:hover {
                background: var(--line);
                color: var(--bg);
                border-color: var(--accent);
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(0,0,0,.15);
            }

            .panel-btn:active {
                transform: translateY(0);
            }

            .panel-btn .material-symbols-outlined {
                font-size: calc(24px + 0.3vw);
                color: inherit;
            }

        /* Мобільна адаптація */
        @media (max-width: 768px) {
            .container {
                width: 100%;
            }

            .right-panel {
                width: 100%;
                position: relative;
                padding: 40px 15px;
            }

            .text-container {
                padding-left: 5%;
            }

            .text {
                font-size: calc(25vw + 10px);
            }

            .panel-btn {
                font-size: 1.3rem;
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <div class="mask" id="mask"></div>
        <div class="text-container">
            <div class="text">2025</div>
        </div>
    </div>

    <!-- Права панель з кнопками -->
    <div class="right-panel">
        <div class="panel-header">
            <h2 style="text-align: center">Пам'ятки архітектури<br>національного значення в Дніпрі</h2>
            <p>Добрянська Крістіна<br>ЛІТ 2025</p>
        </div>
        <div class="buttons-container">
            <a href="/main.html" class="panel-btn">
                <span class="material-symbols-outlined">school</span>
                До випускної роботи
            </a>
            <a href="/documentation.html" class="panel-btn">
                <span class="material-symbols-outlined">description</span>
                Документація
            </a>
        </div>
    </div>

    <script>
        const mask = document.getElementById('mask');
        const background = document.querySelector('.background');
        const text = document.querySelector('.text');

        // Синхронізація фонів
        function syncBackgrounds() {
            const bgStyle = window.getComputedStyle(background);
            text.style.backgroundImage = bgStyle.backgroundImage;
            text.style.backgroundSize = bgStyle.backgroundSize;
            text.style.backgroundPosition = bgStyle.backgroundPosition;
            text.style.backgroundRepeat = bgStyle.backgroundRepeat;
        }

        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const windowWidth = window.innerWidth;
            const offset = 60; // 60px правіше від миші

            // Розраховуємо позицію маски з відступом
            const maskPosition = Math.min(100, Math.max(0, ((mouseX + offset) / windowWidth) * 100));
            mask.style.clipPath = `inset(0 ${100 - maskPosition}% 0 0)`;
        });

        // Синхронізуємо фони
        syncBackgrounds();
        window.addEventListener('resize', syncBackgrounds);
    </script>
</body>
</html>
