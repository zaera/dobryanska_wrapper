<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        :root {
            --bg: #1A1A1A;
            --paper: #222526;
            --ink: #d7d7d7;
            --accent: #5e76fa;
            --text-muted: #8a90a8;
            --overlay-bg: rgba(0, 0, 0, 0.7);
        }

        body {
            background-color: #000; /* Чорний фон для повного екрану */
            color: var(--ink);
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Прибираємо скрол */
        }

        /* --- Стилі Галереї (Full Screen) --- */
        .gallery {
            position: absolute;
            inset: 0; /* Розтягує на весь батьківський елемент (body) */
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* Область перегляду зображення/відео */
        .g-viewport {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

            .g-viewport img,
            .g-viewport iframe {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
                position: absolute; /* Всі фото в одній позиції */
                inset: 0;
                opacity: 0;
                transition: opacity 0.5s ease-in-out; /* Плавний перехід */
                z-index: 1;
            }

            /* Нове фото стає поверх інших і плавно проявляється */
            .g-viewport .active {
                opacity: 1;
                z-index: 2;
            }
        /* Кнопки Назад/Вперед */
        .g-prev, .g-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

            .g-prev:hover, .g-next:hover {
                background: var(--accent);
                transform: translateY(-50%) scale(1.1);
            }

        .g-prev {
            left: 20px;
        }

        .g-next {
            right: 20px;
        }

            /* Збільшуємо іконки стрілок */
            .g-prev span, .g-next span {
                font-size: 32px;
            }

        /* Нижній блок з підписом та точками */
        .g-bottom-bar {
            background: var(--paper);
            z-index: 10;
            padding-bottom: 20px; /* Відступ знизу для естетики */
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* Підпис */
        .g-caption {
            padding: 15px 20px;
            color: var(--ink);
            font-size: 16px;
            text-align: center;
            font-weight: 500;
        }

        /* Навігаційні точки */
        .g-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 12px;
            background: var(--paper);
        }

        .g-dot {
            width: 12px;
            height: 12px;
            min-width: 12px;
            min-height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

            .g-dot:hover {
                background: rgba(255, 255, 255, 0.5);
            }

            .g-dot.active {
                background: var(--accent);
                transform: none;
            }
    </style>
</head>
<body>

    <script>
        function buildGallery(media) {
            const wrap = document.createElement('div');
            wrap.className = 'gallery';

            const viewport = document.createElement('div');
            viewport.className = 'g-viewport';

            const dotsWrap = document.createElement('div');
            dotsWrap.className = 'g-dots';

            // Кнопки навігації
            const btnPrev = document.createElement('button');
            btnPrev.className = 'g-prev';
            btnPrev.innerHTML = '<span class="material-symbols-outlined">chevron_left</span>';

            const btnNext = document.createElement('button');
            btnNext.className = 'g-next';
            btnNext.innerHTML = '<span class="material-symbols-outlined">chevron_right</span>';

            let ix = 0;
            let dots = [];

            // Функція створення тільки для зображень
            function nodeFor(item) {
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = '';
                return img;
            }

            function show(n) {
                ix = (n + media.length) % media.length;
                viewport.innerHTML = '';
                const node = nodeFor(media[ix]);
                viewport.appendChild(node);

                // Плавна поява
                setTimeout(() => node.classList.add('active'), 10);

                dots.forEach((d, i) => d.classList.toggle('active', i === ix));
            }

            // Створення точок
            dots = media.map((_, i) => {
                const d = document.createElement('button');
                d.className = 'g-dot';
                d.addEventListener('click', () => show(i));
                dotsWrap.appendChild(d);
                return d;
            });

            btnPrev.addEventListener('click', () => show(ix - 1));
            btnNext.addEventListener('click', () => show(ix + 1));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') show(ix - 1);
                if (e.key === 'ArrowRight') show(ix + 1);
            });

            wrap.append(viewport, btnPrev, btnNext, dotsWrap);
            show(0);

            return { el: wrap };
        }

        // Ініціалізація тільки з картинками
        document.addEventListener('DOMContentLoaded', () => {
            const tutorialMedia = [];
            for (let i = 1; i <= 24; i++) {
                tutorialMedia.push({ src: `tutorial/${i}.png` });
            }
            const galleryInstance = buildGallery(tutorialMedia);
            document.body.appendChild(galleryInstance.el);
        });

        // === Ініціалізація ===
        document.addEventListener('DOMContentLoaded', () => {

            // Створюємо масив медіа автоматично для картинок
            const tutorialMedia = [];
            for (let i = 1; i <= 24; i++) {
                tutorialMedia.push({
                    type: 'image',
                    src: `tutorial/${i}.png`,
                });
            }

            // Додаємо галерею безпосередньо в body
            const galleryInstance = buildGallery(tutorialMedia);
            document.body.appendChild(galleryInstance.el);
        });
    </script>
</body>
</html>
