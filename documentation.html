<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        :root {
            --bg: #1A1A1A;
            --paper: #222526;
            --ink: #d7d7d7;
            --accent: #5e76fa;
            --text-muted: #8a90a8;
            --overlay-bg: rgba(0, 0, 0, 0.7);
        }

        body {
            background-color: #000;
            color: var(--ink);
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .gallery {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            transition: transform 1.5s cubic-bezier(0.87, 0, 0.13, 1), opacity 1.5s ease;
        }

        .gallery.hide {
            transform: translateY(100%) scale(0.3);
            opacity: 0;
        }

        .g-viewport {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .g-viewport img,
        .g-viewport iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }

        .g-viewport .active {
            opacity: 1;
            z-index: 2;
        }

        .g-viewport::after {
            content: "";
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 5;
            pointer-events: none;
        }

        .g-viewport.fading::after {
            opacity: 1;
        }
        

        .g-prev, .g-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .g-prev:hover, .g-next:hover {
            background: var(--accent);
            transform: translateY(-50%) scale(1.1);
        }

        .g-prev {
            left: 20px;
        }

        .g-next {
            right: 20px;
        }

        .g-prev span, .g-next span {
            font-size: 32px;
        }

        .g-bottom-bar {
            background: var(--paper);
            z-index: 10;
            padding-bottom: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .g-caption {
            padding: 15px 20px;
            color: var(--ink);
            font-size: 16px;
            text-align: center;
            font-weight: 500;
        }

        .g-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 12px;
            background: var(--paper);
        }

        .g-dot {
            width: 12px;
            height: 12px;
            min-width: 12px;
            min-height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .g-dot:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .g-dot.active {
            background: var(--accent);
            transform: none;
        }

        /* Анимация завершения */
        <style>
    /* Додайте цей стиль до існуючих стилів */
    .flow-animation {
        position: fixed;
        inset: 0;
        background: var(--overlay-bg);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
    }

    .flow-animation.active {
        opacity: 1;
        pointer-events: all;
    }

    .flow-content {
        background: var(--paper);
        border-radius: 16px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        text-align: center;
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        transform: translateY(20px);
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .flow-animation.active .flow-content {
        transform: translateY(0);
    }

    .flow-content h1 {
        font-size: 2rem;
        margin: 0 0 16px 0;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
    }

    .flow-content p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin: 0 0 24px 0;
    }

    .flow-content p:last-of-type {
        margin-bottom: 32px;
    }

    .flow-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
    }

    @media (min-width: 480px) {
        .flow-buttons {
            flex-direction: row;
            justify-content: center;
        }
    }

    .flow-button {
        padding: 14px 28px;
        border: none;
        background: var(--accent);
        color: white;
        font-size: 1rem;
        font-weight: 500;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 200px;
    }

    @media (min-width: 480px) {
        .flow-button {
            min-width: 180px;
        }
    }

    .flow-button:hover {
        background: #4a62f0;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(94, 118, 250, 0.3);
    }

    .flow-button.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--ink);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .flow-button.secondary:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
    }

    .flow-button .material-symbols-outlined {
        font-size: 1.2rem;
    }

    /* Анімація появи */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
    </style>
</head>
<body>

    <script>
        function buildGallery(media) {
            const wrap = document.createElement('div');
            wrap.className = 'gallery';

            const viewport = document.createElement('div');
            viewport.className = 'g-viewport';

            const dotsWrap = document.createElement('div');
            dotsWrap.className = 'g-dots';

            const btnPrev = document.createElement('button');
            btnPrev.className = 'g-prev';
            btnPrev.innerHTML = '<span class="material-symbols-outlined">chevron_left</span>';

            const btnNext = document.createElement('button');
            btnNext.className = 'g-next';
            btnNext.innerHTML = '<span class="material-symbols-outlined">chevron_right</span>';

            let ix = 0;
            let dots = [];

            function nodeFor(item) {
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = '';
                return img;
            }

            function show(n) {
                const nextIx = (n + media.length) % media.length;
                viewport.classList.add('fading');
                setTimeout(() => {
                    ix = nextIx;

                    // Очищаем viewport
                    viewport.innerHTML = '';

                    const node = nodeFor(media[ix]);
                    viewport.appendChild(node);

                    setTimeout(() => {
                        node.classList.add('active');
                        viewport.classList.remove('fading');
                    }, 50);

                    dots.forEach((d, i) => d.classList.toggle('active', i === ix));

                    // Проверяем, если это последнее фото
                    if (ix === media.length - 1) {
                        setTimeout(() => {
                            completeGallery();
                        }, 1000);
                    }
                }, 300);
            }

            function completeGallery() {
    const flowAnimation = document.createElement('div');
    flowAnimation.className = 'flow-animation';
    flowAnimation.innerHTML = `
        <div class="flow-content">
            <h1>Навчання завершено!</h1>
            <p>Ви успішно ознайомилися з усіма розділами сайту. Тепер ви можете повернутися на головну сторінку або почати навчання спочатку.</p>
            <div class="flow-buttons">
                <a href="index.html" class="flow-button">
                    <span class="material-symbols-outlined">home</span>
                    Повернутися на сайт
                </a>
                <button id="restartTutorial" class="flow-button secondary">
                    <span class="material-symbols-outlined">replay</span>
                    Почати спочатку
                </button>
            </div>
        </div>
    `;
    
    document.body.appendChild(flowAnimation);

    // Дозволяємо браузеру відобразити елемент перед анімацією
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            flowAnimation.classList.add('active');
        });
    });

    // Приховуємо галерею
    setTimeout(() => {
        if (typeof wrap !== 'undefined') wrap.classList.add('hide');
    }, 500);

    // Обробник кнопки "Почати спочатку"
    flowAnimation.querySelector('#restartTutorial').addEventListener('click', () => {
        flowAnimation.classList.remove('active');
        
        setTimeout(() => {
            flowAnimation.remove();
            if (typeof wrap !== 'undefined') {
                wrap.classList.remove('hide');
            }
            if (typeof show === 'function') {
                show(0);
            }
        }, 500);
    });
}

            dots = media.map((_, i) => {
                const d = document.createElement('button');
                d.className = 'g-dot';
                d.addEventListener('click', () => show(i));
                dotsWrap.appendChild(d);
                return d;
            });

            btnPrev.addEventListener('click', () => show(ix - 1));
            btnNext.addEventListener('click', () => show(ix + 1));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') show(ix - 1);
                if (e.key === 'ArrowRight') show(ix + 1);
            });

            wrap.append(viewport, btnPrev, btnNext, dotsWrap);
            show(0);

            return { el: wrap };
        }

        // Инициализация галереи
        document.addEventListener('DOMContentLoaded', () => {
            const tutorialMedia = [];
            for (let i = 1; i <= 24; i++) {
                tutorialMedia.push({
                    type: 'image',
                    src: `tutorial/${i}.png`,
                });
            }

            const galleryInstance = buildGallery(tutorialMedia);
            document.body.appendChild(galleryInstance.el);
        });
    </script>
</body>
</html>
